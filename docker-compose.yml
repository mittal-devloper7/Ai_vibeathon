services:
  postgres:
    image: postgres:18-alpine
    container_name: hookforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hookforge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hookforge"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis:
    image: redis:8-alpine
    container_name: hookforge-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hookforge-api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hookforge
      REDIS_URL: redis://redis:6379
      HMAC_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      GEMINI_API_KEY: ${GEMINI_API_KEY:-dummy_key}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      ALLOWED_INTERNAL_HOSTS: merchant-simulator,localhost
      ALLOW_INSECURE_HTTP_ENDPOINTS: "true"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npm run migrate && npm run seed && npx tsx src/server.ts"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hookforge-worker
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hookforge
      REDIS_URL: redis://redis:6379
      HMAC_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      GEMINI_API_KEY: ${GEMINI_API_KEY:-dummy_key}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      ALLOWED_INTERNAL_HOSTS: merchant-simulator,localhost
      ALLOW_INSECURE_HTTP_ENDPOINTS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-api:
        condition: service_started
    command: npx tsx src/workerMain.ts

  merchant-simulator:
    build:
      context: ./merchant-simulator
      dockerfile: Dockerfile
    container_name: hookforge-merchant-simulator
    restart: unless-stopped
    ports:
      - "4000:4000"
    command: npx tsx src/server.ts

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hookforge-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    environment:
      VITE_API_BASE_URL: http://localhost:3000/api/v1
    depends_on:
      backend-api:
        condition: service_started

volumes:
  pgdata:
  redisdata:
